[package]
name = "unfazed-trace"
version = "0.1.0"
description = "A lightweight Windows workspace companion that traces time per task."
authors = ["Ansh Thakur"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows-only cargo issue).
name = "unfazed_trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

# Desktop-only plugins (single-instance and autostart are not available on mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Windows: direct dependency (not just transitive via the notification plugin) so we can
# build custom toast XML with action buttons (Start now / Snooze / Dismiss) — Phase 5.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-registry = "0.5"
